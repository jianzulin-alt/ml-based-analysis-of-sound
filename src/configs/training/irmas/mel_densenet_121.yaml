experiment_name: "irmas_single_label_mel_densenet_121"
task_mode: "single_label"
feature_mode: "mel"
dataset: "irmas"

model:
  backbone: "cnn_densenet_121"
  dropout: 0.3
  pretrained_weights: ""

training:
  # DenseNet-121 is heavier than the baseline CNN, so use a smaller batch
  # size and a lower AdamW learning rate as a safer default.
  epochs: 100
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  val_frac: 0.2
  patience: 12
  num_workers: 0
  seed: 1337
  mixed_precision: true

