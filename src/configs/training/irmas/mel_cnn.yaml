experiment_name: "irmas_single_label_mel"
task_mode: "single_label"
feature_mode: "mel"
dataset: "irmas"

model:
  backbone: "cnn"
  dropout: 0.3
  pretrained_weights: ""

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  val_frac: 0.2
  patience: 10
  num_workers: 8
  seed: 1337
  mixed_precision: true


