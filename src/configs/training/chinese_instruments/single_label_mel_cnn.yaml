experiment_name: "chinese_single_label_mel_cnn_ft_irmas"
task_mode: "single_label"
feature_mode: "mel"
dataset: "chinese_instruments"

model:
  backbone: "cnn"
  dropout: 0.3
  pretrained_weights: "src/models/saved_weights/irmas_single_label_mel_cnn/best_val.pt"

training:
  epochs: 40
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  val_frac: 0.2
  patience: 8
  num_workers: 8
  seed: 1337
  mixed_precision: true
