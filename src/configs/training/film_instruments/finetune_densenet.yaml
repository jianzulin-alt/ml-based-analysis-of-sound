experiment_name: "chinese_finetune_mel_densenet"
task_mode: "single_label"
dataset: "chinese_instruments"
feature_mode: "mel"

model:
  backbone: "cnn_densenet_121"
  dropout: 0.4 # Higher dropout for fine-tuning smaller dataset
  # Link to the weights generated by the config above!
  pretrained_weights: "src/models/saved_weights/irmas_pretrain_mel_densenet/best_val.pt"

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.00005 # VERY LOW LR so you don't destroy the pretrained weights
  weight_decay: 0.0005
  val_frac: 0.2
  use_spec_augment: true
  loss_function: "focal" # Triggers the Focal Loss to handle the Guqin/Yangqin imbalance
  patience: 8
  num_workers: 4
  seed: 1337
  mixed_precision: true