experiment_name: irmas_single_label_mel
task_mode: single_label
feature_mode: mel
dataset: irmas
classes:
  - cel
  - cla
  - flu
  - gac
  - gel
  - org
  - pia
  - sax
  - tru
  - vio
  - voi
model:
  backbone: cnn
  dropout: 0.3
  pretrained_weights: ''
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  val_frac: 0.2
  patience: 10
  num_workers: 8
  seed: 1337
  mixed_precision: true
resolved:
  train_config: src/configs/training/irmas/single_label_mel.yaml
  audio_config: src/configs/audio_params.yaml
  labels_config: src/configs/labels.yaml
  primary_manifest: data/processed/irmas_train_mels.csv
  cqt_manifest: ''
  run_dir: src/models/saved_weights/irmas/irmas_single_label_mel_cnn
  resume_checkpoint: src/models/saved_weights/irmas/irmas_single_label_mel_cnn/last.pt
