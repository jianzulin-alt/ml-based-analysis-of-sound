experiment_name: chinese_single_label_mel_cnn_ft_irmas
task_mode: single_label
feature_mode: mel
dataset: chinese_instruments
classes:
  - strings
  - brass
  - woodwind
  - sheng
  - dizi
  - timpani
  - erhu
  - pipa
  - suona
  - guzheng
  - piano
  - guqin
  - xiao
  - yangqin
model:
  backbone: cnn
  dropout: 0.3
  pretrained_weights: src/models/saved_weights/irmas_single_label_mel_cnn/best_val.pt
training:
  epochs: 40
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  val_frac: 0.2
  patience: 8
  num_workers: 8
  seed: 1337
  mixed_precision: true
resolved:
  train_config: src/configs/training/chinese_instruments/single_label_mel_cnn.yaml
  audio_config: src/configs/audio_params.yaml
  labels_config: src/configs/labels.yaml
  primary_manifest: data/processed/chinese_instruments_train_mels.csv
  cqt_manifest: ''
  run_dir: src/models/saved_weights/chinese_single_label_mel_cnn_ft_irmas
  resume_checkpoint: ''
